<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feelme - Cerita di sini, temukan maknanya</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBlue: '#E2ECF8',
                        pastelYellow: '#FEF3C7',
                        navyText: '#2C3E50',
                        softYellowBtn: '#FDE68A'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #F4F8FC;
            color: #2C3E50;
        }
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="w-full py-6 px-8 md:px-16 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-bold tracking-wide text-blue-900 bg-pastelYellow px-5 py-2 rounded-full shadow-sm flex items-center space-x-2">
                <span>✨</span><span>feelme</span>
            </span>
        </div>
        <div class="bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-xs border border-blue-100 cursor-pointer hover:bg-white transition text-sm">
            🌙 Mode Malam
        </div>
    </header>
    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 md:px-8 relative z-10 -mt-10">
        
        <!-- Hero Section -->
        <div id="heroSection" class="w-full flex flex-col items-center">
            <div class="relative max-w-2xl mx-auto">
                <h1 class="text-6xl md:text-7xl font-extrabold text-blue-900 tracking-tight mb-4">
                    feelme
                </h1>
                <div class="inline-block bg-amber-200/90 text-blue-900 font-semibold px-6 py-2.5 rounded-full shadow-sm text-sm md:text-base mb-6 transform -rotate-1">
                    Cerita di sini, temukan maknanya. 🤍
                </div>
            </div>

            <p class="text-gray-600 text-sm md:text-base max-w-md mx-auto mb-8 font-medium leading-relaxed">
                Curhat apa pun yang kamu rasakan, dan temukan pengingat indah dari Al-Qur'an dan hadis.
            </p>

            <!-- Input Box Curhat Awal -->
            <div class="w-full max-w-xl bg-white rounded-full shadow-lg border border-blue-100 p-2.5 flex items-center mb-6 transition-all focus-within:ring-2 focus-within:ring-amber-300">
                <div class="pl-4 text-gray-400 text-xl">💬</div>
                <input type="text" id="initialInput" placeholder="Aku sedang merasa ..." 
                       class="w-full px-4 py-3 bg-transparent focus:outline-none text-gray-700 placeholder-gray-400 text-sm md:text-base font-medium"
                       onkeypress="if(event.key === 'Enter') startChat()">
                <button onclick="startChat()" class="bg-amber-300 hover:bg-amber-400 text-blue-900 p-3.5 rounded-full transition shadow-sm flex items-center justify-center cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>

            <div class="inline-flex items-center space-x-2 bg-white/90 border border-blue-100 px-5 py-2 rounded-full text-xs text-gray-500 shadow-xs font-medium">
                <span>🔒</span>
                <span>Privasi kamu aman bersama kami</span>
                <span class="text-rose-400">🤍</span>
            </div>
        </div>

        <!-- Chat Room Section -->
        <div id="chatSection" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-blue-100 flex flex-col h-[580px] hidden text-left mb-6 overflow-hidden">
            <div class="bg-gradient-to-r from-blue-50 to-amber-50 px-6 py-4 border-b border-blue-100 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-200 text-blue-900 p-2.5 rounded-full text-sm shadow-xs">✨</div>
                    <div>
                        <h3 class="font-bold text-blue-900 text-sm md:text-base">Teman Cerita & Penenang Hati</h3>
                        <p class="text-xs text-gray-500">Selalu ada pengingat indah dari Al-Qur'an & Hadis</p>
                    </div>
                </div>
                <button onclick="resetChat()" class="text-xs font-semibold text-gray-600 hover:text-blue-900 bg-white px-4 py-2 rounded-full border border-blue-200 transition shadow-xs">
                    Selesai / Curhat Baru
                </button>
            </div>

            <div id="chatMessages" class="chat-container flex-grow p-4 md:p-6 overflow-y-auto space-y-4 bg-slate-50/50"></div>

            <div class="p-4 bg-white border-t border-blue-100 flex items-center space-x-3">
                <input type="text" id="chatInput" placeholder="Ketik balasan atau keluh kesahmu..." 
                       class="flex-grow px-5 py-3.5 bg-slate-100 rounded-full focus:outline-none focus:ring-2 focus:ring-amber-300 text-sm text-gray-700 font-medium"
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-amber-300 hover:bg-amber-400 text-blue-900 p-3.5 rounded-full transition shadow-sm flex items-center justify-center cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>
    </main>
    <!-- Hiasan Ilustrasi di Sudut Bawah -->
    <div class="absolute bottom-0 left-0 right-0 pointer-events-none flex justify-between items-end overflow-hidden opacity-60 z-0 px-6 pb-2">
        <div class="text-2xl md:text-3xl">🌸☕📖</div>
        <div class="text-2xl md:text-3xl">🌿🕌✨</div>
    </div>

    <!-- JavaScript Logika & AI -->
    <script>
        function startChat() {
            const inputVal = document.getElementById('initialInput').value.trim();
            if (!inputVal) return;

            document.getElementById('heroSection').classList.add('hidden');
            document.getElementById('chatSection').classList.remove('hidden');

            appendMessage(inputVal, 'user');
            document.getElementById('initialInput').value = '';

            setTimeout(() => {
                const aiReply = getAIResponse(inputVal);
                appendMessage(aiReply, 'ai');
            }, 800);
        }

        function sendMessage() {
            const inputVal = document.getElementById('chatInput').value.trim();
            if (!inputVal) return;

            appendMessage(inputVal, 'user');
            document.getElementById('chatInput').value = '';

            setTimeout(() => {
                const aiReply = getAIResponse(inputVal);
                appendMessage(aiReply, 'ai');
            }, 900);
        }

        function appendMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');

            if (sender === 'user') {
                messageDiv.className = 'flex justify-end';
                messageDiv.innerHTML = `
                    <div class="bg-amber-100 text-blue-900 px-5 py-3.5 rounded-2xl rounded-tr-none max-w-xs md:max-w-md text-sm shadow-xs font-medium">
                        ${escapeHtml(text)}
                    </div>
                `;
            } else {
                messageDiv.className = 'flex justify-start';
                messageDiv.innerHTML = `
                    <div class="bg-white text-gray-700 border border-blue-100 px-6 py-5 rounded-3xl rounded-tl-none max-w-sm md:max-w-lg text-sm shadow-sm space-y-2 leading-relaxed">
                        <div class="font-bold text-blue-900 flex items-center space-x-1.5">
                            <span>✨</span><span>Pengingat untukmu:</span>
                        </div>
                        <div class="text-gray-600">${text}</div>
                    </div>
                `;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getAIResponse(input) {
            const lower = input.toLowerCase();
            
            // 1. Masalah dengan Orang Tua / Keluarga / Berantem Sama Ortu
            if (lower.includes('ortu') || lower.includes('orang tua') || lower.includes('ibu') || lower.includes('mama') || lower.includes('bapak') || lower.includes('ayah') || lower.includes('papa') || lower.includes('keluarga') || lower.includes('rumah')) {
                return `Berbeda pendapat atau bersitegang dengan orang tua memang bikin hati terasa sangat sesak dan bersalah. Allah SWT berfirman tentang adab pada orang tua:<br><br><strong>"Dan Tuhanmu telah memerintahkan agar kamu jangan menyembah selain Dia dan hendaklah berbuat baik kepada ibu bapak..."</strong> (QS. Al-Isra': 23).<br><br>Bagaimanapun keadaan dan perdebatan yang terjadi, rendahkan hati, minta maaf jika ada salah, dan doakan mereka. Ridho Allah bergantung pada ridho orang tua. Peluk sabar ya! 🤍🏡`;
            }
            // 2. Masalah Keuangan / Uang Bulanan / Kos
            else if (lower.includes('uang') || lower.includes('duit') || lower.includes('biaya') || lower.includes('kos') || lower.includes('pas-pasan') || lower.includes('ekonomi') || lower.includes('boros')) {
                return `Urusan finansial memang sering bikin kepala pusing, tapi ingatlah bahwa rezeki setiap orang sudah diatur dengan adil oleh Allah. Allah SWT berfirman:<br><br><strong>"Dan tidak satu pun makhluk bergerak (bernyawa) di bumi melainkan dijamin rezekinya oleh Allah..."</strong> (QS. Hud: 6).<br><br>Tenang ya, hadapi dengan ikhtiar terbaik dan rasa qana'ah. Allah pasti cukupkan kebutuhanmu di jalan-Nya. 💰🤍`;
            }
            // 3. Masalah Kuliah, IPK, Tugas, Dosen, Skripsi
            else if (lower.includes('ipk') || lower.includes('nilai') || lower.includes('dosen') || lower.includes('revisi') || lower.includes('skripsi') || lower.includes('kuliah') || lower.includes('semester') || lower.includes('tugas')) {
                return `Dunia perkuliahan, skripsi, dan urusan akademik memang kadang menguji mental banget. Rasulullah SAW mengajarkan kita doa kemudahan:<br><br><strong>"Ya Allah, tidak ada kemudahan kecuali apa yang Engkau jadikan mudah..."</strong> (HR. Ibnu Hibban).<br><br>Kerjakan semampumu, lakukan yang terbaik, dan serahkan hasilnya kepada Allah. Kamu pasti bisa melewati masa-masa kuliah ini! 🎓✨`;
            }
            // 4. Ditinggal Orang Tersayang / Meninggal / Kehilangan
            else if (lower.includes('meninggal') || lower.includes('wafat') || lower.includes('ditinggal') || lower.includes('kehilangan') || lower.includes('berpulang') || lower.includes('rindu')) {
                return `Kehilangan orang yang kita sayangi adalah ujian terberat bagi hati. Ingatkan diri kita pada ketetapan Allah:<br><br><strong>"Sesungguhnya kami milik Allah dan kepada-Nya kami kembali."</strong> (QS. Al-Baqarah: 156).<br><br>Doa tulus dari orang yang ditinggalkan adalah cahaya terang bagi mereka di sana. Tabah ya, kelak Allah kumpulkan kembali di surga-Nya. 🤍`;
            }
            // 5. Hubungan, Pacaran, Suami, Istri, Jodoh
            else if (lower.includes('pacar') || lower.includes('pasangan') || lower.includes('suami') || lower.includes('istri') || lower.includes('nikah') || lower.includes('hubungan') || lower.includes('toxic') || lower.includes('putus')) {
                return `Dinamika hubungan hati memang sering menguras emosi. Allah memberikan pedoman terbaik dalam membersamai seseorang:<br><br><strong>"Dan di antara tanda-tanda kebesaran-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri, agar kamu merasa tenteram..."</strong> (QS. Ar-Rum: 21).<br><br>Jika hubungan itu mendekatkanmu pada ketaatan, rawatlah. Jika menyakiti, serahkan dan gantungkan hatimu hanya pada Allah. ✨`;
            }
            // 6. Sakit, Badan Lemah, Berobat
            else if (lower.includes('sakit') || lower.includes('demam') || lower.includes('pusing') || lower.includes('dokter') || lower.includes('obat') || lower.includes('badan') || lower.includes('lemas')) {
                return `Sakit yang kamu rasakan hari ini adalah penggugur dosa-dosa kecil. Rasulullah SAW bersabda:<br><br><strong>"Tidaklah seorang muslim tertusuk duri atau yang lebih dari itu, melainkan Allah akan menghapuskan kesalahan-kesalahannya..."</strong> (HR. Bukhari & Muslim).<br><br>Semoga lekas sembuh, tetap semangat minum obat dan perbanyak istirahat ya! ☕🌿`;
            }
            // 7. Kewajiban Muslim, Sholat, Ibadah, Malas
            else if (lower.includes('sholat') || lower.includes('ibadah') || lower.includes('ngaji') || lower.includes('dosa') || lower.includes('taubat') || lower.includes('malas') || lower.includes('kewajiban')) {
                return `Merasa berat dalam beribadah adalah tanda hati sedang butuh 'dicas' kembali dengan dzikir. Allah SWT memanggil hamba-Nya:<br><br><strong>"Maka ingatlah kepada-Ku, Aku pun akan ingat kepadamu..."</strong> (QS. Al-Baqarah: 152).<br><br>Jangan tunda kewajibanmu, ambil air wudhu, bentangkan sajadah, dan adukan semua rasa malasmu dalam sujud. 🕌`;
            }
            // 8. Tanya Soal Ujian / Takdir Hidup
            else if (lower.includes('kenapa') && (lower.includes('ujian') || lower.includes('coba') || lower.includes('takdir'))) {
                return `Allah memberikan ujian bukan karena Dia benci, tapi karena Dia rindu dan ingin mengangkat derajatmu. Allah SWT berfirman:<br><br><strong>"Apakah manusia mengira bahwa mereka akan dibiarkan hanya dengan mengatakan, 'Kami telah beriman' dan mereka tidak diuji?"</strong> (QS. Al-Ankabut: 2).<br><br>Ujian adalah tanda bahwa Allah mempercayai pundakmu kuat menanggungnya. ✨`;
            }
            // 9. Masa Depan & Overthinking
            else if (lower.includes('masa depan') || lower.includes('kerja') || lower.includes('pengangguran') || lower.includes('takut') || lower.includes('quarter life') || lower.includes('bingung')) {
                return `Memikirkan masa depan atau karier memang bikin overthinking. Tapi ingatlah janji Allah yang indah:<br><br><strong>"Dan sesungguhnya kelak Tuhanmu pasti akan memberikan karunia-Nya kepadamu, sehingga kamu menjadi puas."</strong> (QS. Ad-Duha: 5).<br><br>Jangan cemas berlebihan, fokus saja berproses hari ini dengan sebaik-baiknya. 🌅`;
            }
            // 10. Lelah / Capek Umum
            else if (lower.includes('cape') || lower.includes('lelah') || lower.includes('full') || lower.includes('sibuk') || lower.includes('beban') || lower.includes('berat')) {
                return `Peluk jauh secara virtual ya. Wajar sekali merasa lelah. Allah SWT berfirman:<br><br><strong>"Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya..."</strong> (QS. Al-Baqarah: 286).<br><br>Semua lelahmu bernilai pahala besar. Istirahat sejenak ya. 🤍`;
            } 
            // 11. Sedih & Kecewa
            else if (lower.includes('sedih') || lower.includes('kecewa') || lower.includes('nangis') || lower.includes('galau') || lower.includes('sakit hati') || lower.includes('patah hati')) {
                return `Hatimu mungkin sedang berat, tapi ingatlah:<br><br><strong>"Janganlah kamu bersedih, sesungguhnya Allah beserta kita."</strong> (QS. At-Tawbah: 40).<br><br>Ujian ini tanda Allah rindu doamu. Badai ini pasti berlalu membawa hikmah. ✨`;
            } 
            // 12. Kesepian
            else if (lower.includes('sendiri') || lower.includes('kesepian') || lower.includes('sepi') || lower.includes('gak ada yang peduli') || lower.includes('diabaikan')) {
                return `Meskipun rasanya sepi dan tidak ada manusia di sekitarmu, kamu tidak pernah benar-benar sendiri. Rasulullah SAW bersabda:<br><br><strong>"Aku sesuai persangkaan hamba-Ku kepada-Ku, dan Aku bersamanya jika ia mengingat-Ku."</strong> (HR. Bukhari & Muslim).<br><br>Ajak Allah ngobrol lewat doa ya, Dia sangat dekat. 🤍`;
            } 
            // 13. Cemas / Stres
            else if (lower.includes('cemas') || lower.includes('takut') || lower.includes('khawatir') || lower.includes('overthinking') || lower.includes('panik') || lower.includes('ragu') || lower.includes('gelisah') || lower.includes('stres')) {
                return `Rasa cemas dan *overthinking* wajar terjadi, tapi kembalikan ketenteraman hati kepada-Nya:<br><br><strong>"Hanya dengan mengingati Allah-lah hati menjadi tenteram."</strong> (QS. Ar-Ra'd: 28).<br><br>Tenangkan hatimu, Allah sudah mengatur semuanya dengan sangat baik. 🌿`;
            } 
            // 14. Syukur & Bahagia
            else if (lower.includes('syukur') || lower.includes('senang') || lower.includes('alhamdulillah') || lower.includes('bahagia') || lower.includes('seru') || lower.includes('lega')) {
                return `Alhamdulillah! Allah berjanji akan menambah nikmat bagi hamba-Nya yang bersyukur:<br><br><strong>"Sesungguhnya jika kamu bersyukur, pasti Kami akan menambah (nikmat) kepadamu..."</strong> (QS. Ibrahim: 7). Terus sebarkan energi positif ya! 🌻`;
            } 
            // 15. Marah & Kesal
            else if (lower.includes('marah') || lower.includes('kesal') || lower.includes('emosi') || lower.includes('jengkel') || lower.includes('bete')) {
                return `Wajar jika amarah datang menguji kesabaran. Rasulullah SAW berpesan:<br><br><strong>"Janganlah marah, maka bagimu surga."</strong> (HR. Thabrani).<br><br>Tarik napas dan basuh muka agar hatimu kembali dingin dan tenang. 💧`;
            }
            // 16. Gagal / Menyerah
            else if (lower.includes('gagal') || lower.includes('putus asa') || lower.includes('menyerah') || lower.includes('buntu') || lower.includes('ambyar')) {
                return `Jangan pernah merasa jalanmu buntu. Allah SWT memberikan harapan indah:<br><br><strong>"Karena sesungguhnya sesudah kesulitan itu ada kemudahan."</strong> (QS. Al-Insyirah: 5).<br><br>Kegagalan hari ini adalah batu loncatan menuju versi dirimu yang jauh lebih kuat. Bangkit lagi ya! ✨`;
            }
            // Default Umum
            else {
                return `Aku mendengarkan setiap kata dari cerita dan perasaanmu. Apapun yang sedang kamu hadapi, sandarkan segalanya kepada Allah:<br><br><strong>"Barangsiapa bertakwa kepada Allah, niscaya Dia akan membukakan jalan keluar baginya."</strong> (QS. At-Talaq: 2).<br><br>Ceritakan lagi apa yang sedang mengganjal di hatimu, aku di sini selalu mendengarkan. 🤍`;
            }
        }

        function resetChat() {
            document.getElementById('chatSection').classList.add('hidden');
            document.getElementById('heroSection').classList.remove('hidden');
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('initialInput').value = '';
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
